name: Script Automatique Résultats

on:
  schedule:
    - cron: '0 20 * * 0' # Dimanche soir à 21h
    - cron: '0 6 * * 1'  # Lundi matin à 7h
  workflow_dispatch:     # Permet de lancer à la main pour tester

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les outils
        run: pip install requests

      - name: Lancer le robot
        run: python scraper.py

      - name: Enregistrer les nouveaux scores
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Robot Scores"
          git add data/results.json
          git commit -m "Mise à jour automatique des résultats" || exit 0
          git push
