name: Pages brutes (développement)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Adresses séparées par des espaces"
        required: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python tools/fetch_raw.py ${{ github.event.inputs.urls }}
      - uses: actions/upload-artifact@v4
        with: {name: raw, path: raw/, retention-days: 3}
