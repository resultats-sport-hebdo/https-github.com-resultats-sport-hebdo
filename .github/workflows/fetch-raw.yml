name: Pages brutes (développement)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Adresses séparées par des espaces"
        required: true
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python tools/fetch_raw.py
        env:
          URLS: ${{ github.event.inputs.urls }}
      - name: Déposer les pages sur la branche dev-raw
        run: |
          git config user.name "Robot Résultats"; git config user.email "robot@users.noreply.github.com"
          git checkout --orphan dev-raw; git rm -rqf --cached .; git add raw; git commit -qm "pages brutes"; git push -qf origin dev-raw
