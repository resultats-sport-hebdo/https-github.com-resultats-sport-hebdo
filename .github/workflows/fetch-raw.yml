name: Pages brutes (développement)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Adresses séparées par des espaces"
        required: true
      browser:
        description: "Utiliser un vrai navigateur (true/false)"
        default: "false"
      headers:
        description: "En-têtes JSON (développement)"
        default: ""
      gql:
        description: "Requête GraphQL Score'n'co (développement)"
        default: ""
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests playwright
      - if: github.event.inputs.browser == 'true'
        run: python -m playwright install --with-deps chromium
      - if: github.event.inputs.browser == 'true'
        run: python tools/browse.py
        env:
          URLS: ${{ github.event.inputs.urls }}
      - if: github.event.inputs.gql != ''
        run: python tools/gql.py
        env:
          QUERY: ${{ github.event.inputs.gql }}
          VARS: ${{ github.event.inputs.headers }}
      - if: github.event.inputs.browser != 'true' && github.event.inputs.gql == ''
        run: python tools/fetch_raw.py
        env:
          URLS: ${{ github.event.inputs.urls }}
          HEADERS: ${{ github.event.inputs.headers }}
      - name: Déposer les pages sur la branche dev-raw
        run: |
          git config user.name "Robot Résultats"; git config user.email "robot@users.noreply.github.com"
          git checkout --orphan dev-raw; git rm -rqf --cached .; git add raw; git commit -qm "pages brutes"; git push -qf origin dev-raw
