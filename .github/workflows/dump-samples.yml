name: Extraits des sources (développement)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Adresses séparées par des espaces"
        required: true
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python tools/dump_samples.py ${{ github.event.inputs.urls }}
