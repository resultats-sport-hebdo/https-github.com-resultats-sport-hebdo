name: Robot résultats

on:
  schedule:
    - cron: '59 22 * * 5'  # vendredi 23h59 (heure d'hiver de Paris)
    - cron: '59 22 * * 6'  # samedi 23h59
    - cron: '0 19 * * 0'   # dimanche 20h (heure d'hiver de Paris)
    - cron: '0 4 * * 1'    # lundi 5h, bien avant la tâche de 6h42 (GitHub retarde parfois ses passages)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Essai sans enregistrer (true/false)"
        default: "true"
      today:
        description: "Date simulée AAAA-MM-JJ (vide = aujourd'hui)"
        default: ""
      only:
        description: "Sports à lire : foot,volley,basket,rugby (vide = tous)"
        default: ""
      publish:
        description: "Publier aussi sur le site public Netlify (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests playwright
      - name: Navigateur (sites de la FFBB et de la FFR)
        run: python -m playwright install --with-deps chromium
      - name: Lancer le robot
        env:
          T: ${{ github.event.inputs.today }}
          ONLY: ${{ github.event.inputs.only }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          OPT=""; [ -n "$T" ] && OPT="$OPT --today $T"; [ -n "$ONLY" ] && OPT="$OPT --only $ONLY"
          [ "$DRY" = "true" ] && OPT="$OPT --dry-run"
          python -u robot/robot.py $OPT
      - name: Enregistrer s'il y a du nouveau
        if: github.event.inputs.dry_run != 'true'
        env:
          # le week-end (vendredi, samedi, dimanche soir), le robot publie aussi le site public ;
          # le lundi, c'est la tâche de 6h42 qui publie l'édition complète
          PUBLISH: ${{ github.event.schedule == '59 22 * * 5' || github.event.schedule == '59 22 * * 6' || github.event.schedule == '0 19 * * 0' || github.event.inputs.publish == 'true' }}
        run: |
          git config user.name "Robot Résultats"
          git config user.email "robot@users.noreply.github.com"
          git add data.js data.json
          git diff --cached --quiet && { echo "Rien de nouveau"; exit 0; }
          if [ "$PUBLISH" = "true" ]; then
            echo "PUBLISH_SITE=1" >> "$GITHUB_ENV"
            git commit -m "Robot : mise à jour du week-end"
          else
            git commit -m "Robot : résultats et classements [skip netlify]"
          fi
      - uses: actions/setup-node@v4
        if: env.PUBLISH_SITE == '1'
        with: {node-version: '20'}
      - name: Regénérer les pages du site public
        if: env.PUBLISH_SITE == '1'
        run: |
          npm i --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          node build.js
          git add -A
          git diff --cached --quiet || git commit --amend --no-edit
      - name: Envoyer
        if: github.event.inputs.dry_run != 'true'
        run: |
          git log origin/main..HEAD --oneline | grep -q . || exit 0
          git pull --rebase -q && git push
