name: Test des sources de résultats

on:
  workflow_dispatch:   # lancement à la main uniquement, aucun envoi vers Netlify

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python tools/probe_sources.py
